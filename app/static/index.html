<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paper Study</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Ctext x='16' y='23' font-size='19' font-weight='800' text-anchor='middle' fill='white' font-family='system-ui'%3EP%3C/text%3E%3C/svg%3E">
  <script>
    // 저장된 테마를 첫 페인트 전에 적용
    try { const t = localStorage.getItem("ps.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <script defer src="/static/vendor/marked.min.js"></script>
  <script defer src="/static/vendor/purify.min.js"></script>
  <script defer src="/static/vendor/katex/katex.min.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#/"><span class="brand-mark">P</span>Paper Study</a>
      <nav class="nav" id="nav" aria-label="주 메뉴">
        <a href="#/" data-route="home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>홈</a>
        <a href="#/search" data-route="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>검색</a>
        <a href="#/library" data-route="library">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4v16H5zM10 4h4v16h-4z"/><path d="M15.5 6.5l3.8-1 3.2 13.5-3.8 1z" transform="translate(-2 0)"/></svg>라이브러리</a>
        <a href="#/review" data-route="review">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="13" rx="2"/><path d="M7 3h12a2 2 0 012 2v11"/></svg>복습<span class="badge hidden" id="due-badge"></span></a>
        <a href="#/roadmap" data-route="roadmap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h5a3 3 0 003-3V8"/></svg>로드맵</a>
        <a href="#/surveys" data-route="surveys">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg>서베이</a>
      </nav>
      <div class="sidebar-foot">
        <button class="btn ghost sm" id="theme-btn" type="button">테마 바꾸기</button>
        <span class="small"><kbd>/</kbd> 검색으로 이동</span>
      </div>
    </aside>
    <main class="main" id="view" tabindex="-1"></main>
  </div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <dialog id="confirm-dialog">
    <h2 id="confirm-title"></h2>
    <p class="muted" id="confirm-text"></p>
    <div class="dialog-actions">
      <button class="btn" type="button" data-answer="no">취소</button>
      <button class="btn primary" type="button" data-answer="yes" id="confirm-ok"></button>
    </div>
  </dialog>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
